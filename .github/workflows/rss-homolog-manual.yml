name: RSS homolog - pauta, IA e rascunho (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "queue: rotina antiga; preflight: somente verifica Groq; handoff: pacote; draft: rascunho privado"
        type: choice
        required: true
        default: queue
        options:
          - queue
          - preflight
          - handoff
          - draft
      quota_confirmation:
        description: "handoff/draft: QUOTA_GRATUITA (confirme o plano/limite antes da chamada)"
        type: string
        required: false
      draft_confirmation:
        description: "draft: RASCUNHO (autoriza somente criar/reutilizar rascunho, nunca publicar)"
        type: string
        required: false
      featured_media_id:
        description: "Opcional: ID de imagem já autorizada na biblioteca WP para uma única pauta"
        type: string
        required: false
      media_rights_confirmed:
        description: "Confirme que possui direito de reutilizar essa imagem (nunca por inferência)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rss-homolog-manual-queue
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'queue' || inputs.mode == '') && github.ref == 'refs/heads/master' && github.repository == 'rmsports33/MKT-RSS' }}
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 8
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only RSS dependencies
        run: python -m pip install 'requests>=2.31.0' 'feedparser>=6.0.0'
      - name: Guard homolog environment before network
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          expected='mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io'
          url=os.environ.get('TURSO_DATABASE_URL','')
          if urlsplit(url).hostname != expected:
              raise SystemExit('BLOCKED: homolog database URL mismatch')
          if not os.environ.get('TURSO_AUTH_TOKEN','').strip():
              raise SystemExit('BLOCKED: missing Turso homolog token in environment rss-homolog')
          print('Homolog database guard OK; credentials not printed')
          PY
      - name: Queue only - 9to5google - maximum 3 RSS items
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python pipeline_rss.py --queue-only --fonte 9to5google --limit 3

  editorial:
    # Manual only, repository owner only, zero cron and no deploy. Does not run for mode=queue.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'rmsports33/MKT-RSS' && github.ref == 'refs/heads/master' && github.actor == 'rmsports33' && inputs.mode != 'queue' && inputs.mode != '' }}
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 9
    steps:
      - name: Checkout immutable editorial build for this run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official Groq SDK for read-only preflight
        run: python -m pip install -q 'groq==1.6.0'

      - name: Confirm secrets and model using official SDK without generation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MODE: ${{ inputs.mode }}
          QUOTA_CONFIRMATION: ${{ inputs.quota_confirmation }}
          DRAFT_CONFIRMATION: ${{ inputs.draft_confirmation }}
          WP_URL: ${{ inputs.mode == 'draft' && secrets.WP_URL || '' }}
          WP_USER: ${{ inputs.mode == 'draft' && secrets.WP_USER || '' }}
          WP_APP_PASSWORD: ${{ inputs.mode == 'draft' && secrets.WP_APP_PASSWORD || '' }}
        run: |
          python - <<'PY'
          import os
          from groq import Groq
          mode = os.getenv("MODE", "")
          if mode not in ("preflight", "handoff", "draft"):
              raise SystemExit("BLOCKED: invalid mode")
          if mode in ("handoff", "draft") and os.getenv("QUOTA_CONFIRMATION") != "QUOTA_GRATUITA":
              raise SystemExit("BLOCKED: free quota not confirmed for generation")
          if mode == "draft":
              if os.getenv("DRAFT_CONFIRMATION") != "RASCUNHO":
                  raise SystemExit("BLOCKED: explicit private-draft confirmation missing")
              if (os.getenv("WP_URL", "").rstrip("/") != "https://conexotech.com.br"
                      or not os.getenv("WP_USER") or not os.getenv("WP_APP_PASSWORD")):
                  raise SystemExit("BLOCKED: WordPress target or credentials unavailable")
          key = os.getenv("GROQ_API_KEY", "").strip()
          model = os.getenv("GROQ_MODEL", "").strip()
          if not key or not model:
              raise SystemExit("BLOCKED: Groq credentials or model unavailable")
          try:
              catalog = Groq(api_key=key, timeout=15.0, max_retries=0).models.list()
              available = {entry.id for entry in catalog.data}
          except Exception as exc:
              code = getattr(exc, "status_code", None)
              print("BLOCKED: Groq SDK returned", type(exc).__name__,
                    code if isinstance(code, int) else "no_status")
              raise SystemExit("BLOCKED: authenticated Groq read-only preflight failed") from None
          if model not in available:
              raise SystemExit("BLOCKED: selected Groq model is not available")
          print("PASS: existing Groq secret and model validated with official SDK; no generation.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Groq SDK preflight OK. Free-tier quota NOT verified; no generated tokens.\n")
          PY

      - name: Install RSS dependencies only for generation
        if: ${{ inputs.mode == 'handoff' || inputs.mode == 'draft' }}
        run: python -m pip install -r requirements/rss.txt

      - name: Create one editorial handoff (no WordPress credentials)
        if: ${{ inputs.mode == 'handoff' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          CONEXO_RSS_DRAFT: '0'
          CONEXO_RSS_DRAFT_STAGING: '0'
          CONEXO_RSS_RESEARCH_FEEDS: '1'
          CONEXO_RSS_RELATED_LINKS: '1'
        run: |
          mkdir -p output/handoffs
          python pipeline_rss.py --fonte tecnoblog --limit 1 --handoff-only --handoff-dir output/handoffs > rss-result.jsonl

      - name: Stage exactly one private WordPress draft (no publication)
        if: ${{ inputs.mode == 'draft' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CONEXO_RSS_DRAFT: '1'
          CONEXO_RSS_DRAFT_STAGING: '0'
          CONEXO_RSS_RESEARCH_FEEDS: '1'
          CONEXO_RSS_RELATED_LINKS: '1'
          FEATURED_MEDIA_ID: ${{ inputs.featured_media_id }}
          MEDIA_RIGHTS: ${{ inputs.media_rights_confirmed }}
        run: |
          mkdir -p output/handoffs
          media_args=()
          if [ -n "$FEATURED_MEDIA_ID" ]; then
            case "$FEATURED_MEDIA_ID" in
              *[!0-9]*|'') echo "BLOCKED: media ID inválido"; exit 2 ;;
            esac
            if [ "$MEDIA_RIGHTS" != "true" ]; then
              echo "BLOCKED: direitos da imagem não confirmados"; exit 2
            fi
            media_args+=(--featured-media-id "$FEATURED_MEDIA_ID" --confirm-media-rights)
          elif [ "$MEDIA_RIGHTS" = "true" ]; then
            echo "BLOCKED: confirmação de direitos sem media ID"; exit 2
          fi
          python pipeline_rss.py --fonte tecnoblog --limit 1 --handoff-dir output/handoffs "${media_args[@]}" > rss-result.jsonl

      - name: Verify persisted result and hash (safe summary only)
        if: ${{ inputs.mode == 'handoff' || inputs.mode == 'draft' }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from mkt_flow_p0.editorial_identity import validar_handoff_chatgpt
          events = []
          for line in Path("rss-result.jsonl").read_text(encoding="utf-8").splitlines():
              try: events.append(json.loads(line))
              except ValueError: continue
          mode = os.environ["MODE"]
          expected = "pacote_editorial_criado" if mode == "handoff" else "publicado_rascunho"
          matches = [x for x in events if x.get("acao") == expected]
          if len(matches) != 1:
              raise SystemExit("BLOCKED: no single expected article result; inspect sanitised RSS logs")
          item = matches[0]
          handoff_file = Path(item.get("handoff_path") or "")
          if not handoff_file.is_file() or not str(handoff_file).startswith("output/handoffs/"):
              raise SystemExit("BLOCKED: editorial handoff was not persisted")
          packet = json.loads(handoff_file.read_text(encoding="utf-8"))
          check = validar_handoff_chatgpt(packet)
          if mode == "handoff" and item.get("escreveu") is not False:
              raise SystemExit("BLOCKED: unexpected WordPress write in handoff")
          if mode == "draft" and (item.get("status") != "draft" or
                  type(item.get("post_id")) is not int or item["post_id"] < 1):
              raise SystemExit("BLOCKED: private draft did not pass WordPress readback")
          lines = [f"Mode: {mode}", f"Handoff SHA-256: {check['version_sha256']}",
                   f"Sources: {check['source_count']}; pending claims: {check['claims_pending']}",
                   "Editorial approval: PENDING_HUMAN_REVIEW"]
          if mode == "draft":
              lines.append(f"Confirmed private WP draft ID: {item['post_id']}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          Path("output/qa").mkdir(parents=True, exist_ok=True)
          manifest = {
              "mode": mode, "version_sha256": check["version_sha256"],
              "sources_count": check["source_count"],
              "claims_pending": check["claims_pending"],
              "review_status": "PENDING_HUMAN_REVIEW",
              "quality_status": item.get("quality_status", "SEM_DIAGNOSTICO"),
              "quality_pending": item.get("quality_pending", []),
              "quality_words": item.get("quality_words"),
              "private_draft_id": item["post_id"] if mode == "draft" else None,
          }
          Path("output/qa/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PASS: private editorial package verified; no publication.")
          PY

      - name: Retain only a redacted manifest for one day
        if: ${{ success() && (inputs.mode == 'handoff' || inputs.mode == 'draft') }}
        uses: actions/upload-artifact@v4
        with:
          name: mkt-rss-review-${{ github.run_id }}
          # Public repo: never upload unpublished article text or source claims.
          path: output/qa/manifest.json
          if-no-files-found: error
          retention-days: 1







