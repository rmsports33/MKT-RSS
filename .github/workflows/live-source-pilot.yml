name: Live source pilot - isolated
on:
  push:
    branches:
      - test/live-source-failclosed-20261026
    paths:
      - 'tests/test_live_primary_source_failclosed.py'
      - 'redator-artigo-blogs/tests/test_render.py'
      - '.github/workflows/live-source-pilot.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tests/test_live_primary_source_failclosed.py'
      - '.github/workflows/live-source-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-and-block:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CONEXO_LIVE_SOURCE_TEST: '1'
      WP_URL: ''
      WP_USER: ''
      WP_APP_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing runtime test dependencies
        run: |
          python -m pip install -r requirements/base.txt
          python -m pip install trafilatura pytest
      - name: Real primary-source extraction and WP fail-closed
        run: python -m pytest tests/test_live_primary_source_failclosed.py -q -rs
      - name: Verify reconciled byline regression
        run: python -m pytest redator-artigo-blogs/tests/test_render.py::test_titulo_usa_marca -q
