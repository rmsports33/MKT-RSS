name: RSS diario (WP draft)

# Roda o pipeline RSS 1x/dia sem PC ligado. PC vira só revisão no WP.
on:
  schedule:
    # 12:00 UTC = 09:00 BRT. Mínimo do Actions: 5 min; atraso de 5-15 min é normal.
    - cron: "0 12 * * *"
  workflow_dispatch: # botão "Run workflow" para teste manual
    inputs:
      limit:
        description: "Itens por fonte"
        required: false
        default: "2"

permissions:
  contents: read # este job não commita nada

jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-rss.txt

      - name: Instalar deps (slim)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rss.txt

      - name: Rodar pipeline RSS
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          LIMIT="${INPUT_LIMIT:-2}"
          python pipeline_rss.py --limit "$LIMIT"

      - name: Anexar DB do dia (auditoria)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-runs-${{ github.run_number }}
          path: mkt_flow_p0.db
          retention-days: 14
