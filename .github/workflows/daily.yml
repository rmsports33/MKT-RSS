name: RSS diario - fila editorial sem IA nem WordPress

# Coleta somente pautas: nao gera texto com IA, nao cria rascunhos, nao publica.
# Producao supervisionada permanece no workflow manual rss-homolog-manual.yml.
on:
  schedule:
    # 12:00 UTC = 09:00 BRT. Mínimo do Actions: 5 min; atraso de 5-15 min é normal.
    - cron: "0 12 * * *"
  workflow_dispatch: # botão "Run workflow" para teste manual
    inputs:
      limit:
        description: "Itens por fonte"
        required: false
        default: "2"

permissions:
  contents: read # este job não commita nada

jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/rss.txt

      - name: Instalar deps (slim)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/rss.txt

      - name: Coletar fila RSS, sem inferencia e sem WordPress
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CONEXO_PRODUCT_LINKS_ENABLED: '1'
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          LIMIT="${INPUT_LIMIT:-2}"
          case "$LIMIT" in
            1|2|3) ;;
            *) echo "BLOCKED: limite deve ser 1 a 3"; exit 2 ;;
          esac
          python pipeline_rss.py --queue-only --fonte tecnoblog --limit "$LIMIT"

      - name: Anexar DB do dia (auditoria)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rss-runs-${{ github.run_number }}
          path: mkt_flow_p0.db
          retention-days: 1
          if-no-files-found: ignore
