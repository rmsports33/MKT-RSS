name: RSS diario - fila editorial sem IA nem WordPress

# Coleta somente pautas: nao gera texto com IA, nao cria rascunhos, nao publica.
# Producao supervisionada permanece no workflow manual rss-homolog-manual.yml.
on:
  schedule:
    # 12:17 UTC = 09:17 BRT; agenda best effort, sem garantia de horario.
    - cron: "17 12 * * *"
  workflow_dispatch: # botão "Run workflow" para teste manual
    inputs:
      limit:
        description: "Itens por fonte"
        required: false
        default: "2"

permissions:
  contents: read # este job não commita nada

concurrency:
  group: editorial-rss-discovery
  cancel-in-progress: false

jobs:
  rss:
    # Explicit account-level free-usage review is required, not an assumed quota.
    if: vars.CONEXO_FREE_AUTOMATION_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Exigir persistencia fora do runner antes da coleta
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          test -n "$TURSO_DATABASE_URL" && test -n "$TURSO_AUTH_TOKEN" || {
            echo 'BLOCKED: persistencia cloud ausente; nao criar fila efemera'; exit 2;
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/rss.txt

      - name: Instalar deps (slim)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/rss.txt

      - name: Coletar fila RSS, sem inferencia e sem WordPress
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          INPUT_LIMIT: ${{ inputs.limit }}
          CONEXO_REQUIRE_CLOUD_PERSISTENCE: '1'
        run: |
          LIMIT="${INPUT_LIMIT:-2}"
          case "$LIMIT" in
            1|2|3) ;;
            *) echo "BLOCKED: limite deve ser 1 a 3"; exit 2 ;;
          esac
          python pipeline_rss.py --queue-only --fonte tecnoblog --limit "$LIMIT"

      - name: Registrar resultado sem expor banco editorial
        if: success()
        run: echo 'Coleta concluida no armazenamento configurado; sem LLM e sem WP.' >> "$GITHUB_STEP_SUMMARY"
