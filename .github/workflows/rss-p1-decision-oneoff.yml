name: P1 synthetic editorial decision homologation one-off

on:
  push:
    branches: [master]
    paths: ['.github/workflows/rss-p1-decision-oneoff.yml']

permissions:
  contents: read

jobs:
  decide:
    if: ${{ github.repository == 'rmsports33/MKT-RSS' }}
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5ceba2fbb7accf782bc8049d7939e9280d6f4536
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Synthetic item and confirmed individual decision
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CASE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, json
          from rss_editorial_triage import consultar_guard
          from mkt_flow_p0.fila_pautas import registrar
          from mkt_flow_p0.triagem_decisoes import decidir
          consultar_guard()
          case=os.environ['CASE']
          entry={'fonte':'homolog-p1-sintetico',
                 'titulo':'Prova tecnica sintetica P1 '+case,
                 'link':'https://example.org/p1-sintetico/'+case,
                 'resumo':'Somente homologacao; nao representa noticia real'}
          result=registrar(entry)
          if not result['novo']:
              raise SystemExit('BLOCKED: synthetic URL already exists')
          audit=decidir(result['id'], 'selecionar',
              'Teste sintetico de auditoria persistente', 'github-actions-homolog',
              confirmado=True)
          assert audit['pauta_id']==result['id'] and audit['posterior']=='SELECIONADA'
          print(json.dumps({'phase':'decide','synthetic':True,'id':result['id'],
                            'decision':audit['posterior'],'audit':True}))
          PY
  verify:
    needs: decide
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5ceba2fbb7accf782bc8049d7939e9280d6f4536
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Independent audit and state persistence verification
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CASE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,json,hashlib
          from rss_editorial_triage import consultar_guard
          from mkt_flow_p0 import fila_pautas as fila
          from mkt_flow_p0.triagem_decisoes import historico
          consultar_guard()
          url=f"https://example.org/p1-sintetico/{os.environ['CASE']}"
          uid=hashlib.sha256(fila._url(url).encode()).hexdigest()[:32]
          rows,_=fila._exec('SELECT estado,fonte FROM rss_pautas WHERE id=?',(uid,))
          audit=historico(uid)
          if len(rows)!=1 or rows[0]!=['SELECIONADA','homolog-p1-sintetico']:
              raise SystemExit('FAILED: selected state not persisted or wrong source')
          if len(audit)!=1 or audit[0]['posterior']!='SELECIONADA' or audit[0]['anterior']!='DESCOBERTA':
              raise SystemExit('FAILED: persistent audit missing or inconsistent')
          print(json.dumps({'phase':'verify','persisted':True,'audit_persisted':True,
                            'id':uid,'state':rows[0][0]}))
          PY
