name: Bot Telegram (always-on via Actions)

# Alternativa grátis a VM: mantém bot em polling com restart a cada 5h55.
# Limite do Actions: 6h por job; cron a cada 6h renova. Melhor host real
# é Fly.io/Render (Dockerfile em admin/), mas este workflow evita "dorme".
# Requer secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_IDS, WP_*, GROQ_API_KEY

on:
  schedule:
    - cron: "0 */6 * * *" # a cada 6h UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-polling
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # <6h, renova no próximo cron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/rss.txt
      - name: Instalar deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/rss.txt
          pip install "python-telegram-bot==20.*"
      - name: Rodar bot (polling)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_IDS: ${{ secrets.TELEGRAM_ALLOWED_IDS }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          # Dorme no max timeout-5min; se cair, próximo cron re-sobe
          timeout 345m python admin/bot.py || echo "bot encerrou/timeout — próximo cron re-sobe"
