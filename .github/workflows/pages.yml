name: Dashboard Pages

# Publica dashboard_p1.html em GitHub Pages (acesso no celular sem PC).
# Ative em Settings → Pages → Source: GitHub Actions (uma vez).

on:
  push:
    branches: [master]
    paths:
      - "mkt_flow_p0/dashboard.py"
      - "mkt_flow_p0.db"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "15 12 * * *" # 09:15 BRT, logo após o daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          python -m mkt_flow_p0.dashboard || true
          mkdir -p _site
          cp dashboard_p1.html _site/index.html
          cp dashboard_p1.json _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
