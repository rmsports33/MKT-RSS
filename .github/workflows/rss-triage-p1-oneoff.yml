name: P1 triage read-only Turso one-off

on:
  push:
    branches: [master]
    paths: ['.github/workflows/rss-triage-p1-oneoff.yml']

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.repository == 'rmsports33/MKT-RSS' }}
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b0956df99d6580c16cb70e95d10359c07be16951
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Read at most three discovered headlines from isolated homolog
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python rss_editorial_triage.py --homolog --limit 3
