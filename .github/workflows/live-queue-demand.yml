name: Actual daily queue - readonly demand research
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: live-queue-demand
  cancel-in-progress: false
jobs:
  select:
    if: >-
      github.repository == 'rmsports33/MKT-RSS' && github.event.repository.private == false &&
      github.event.sender.login == github.repository_owner &&
      github.event.issue.title == '[daily-queue] pesquisar pauta existente'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      candidate: ${{ steps.select.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline readonly selection regressions
        env:
          PYTHONPATH: tests
        run: python3 -S -m unittest test_live_queue_demand -v
      - run: python3 -m pip install requests==2.34.2
      - name: Read with the SAME repository secrets as daily; no environment override
        id: select
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python3 scripts/live_queue_demand_probe.py select
  measure:
    needs: select
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install trendspyg==1.9.0 requests==2.34.2
      - name: Measure entity from existing queue; keep full series in existing private homolog
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          CONEXO_DEMAND_TURSO_ALLOWED_HOST: mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CANDIDATE_JSON: ${{ needs.select.outputs.candidate }}
        run: python3 scripts/live_queue_demand_probe.py measure
