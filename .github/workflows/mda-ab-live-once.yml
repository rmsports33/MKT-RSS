name: MDA A/B live - one authorized free-tier run

on:
  push:
    branches: [master]
    paths: [.github/workflows/mda-ab-live-once.yml]

permissions:
  contents: read

concurrency:
  group: mda-ab-groq-20261110-owner-once
  cancel-in-progress: false

jobs:
  ab:
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'rmsports33/MKT-RSS' && github.actor == 'rmsports33' && startsWith(github.event.head_commit.message, 'homolog: run approved free-tier MDA AB once 20261110') }}
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 20
    steps:
      - name: Checkout immutable authorized revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing provider, WordPress read and encryption dependencies
        run: python -m pip install -q -r requirements/rss.txt 'cryptography>=45,<47'

      - name: Fetch four private WordPress drafts read-only, run bounded Groq comparison and encrypt results
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MDA_AB_FREE_CONFIRMATION: CONFIRMED_FREE_TIER
          MDA_AB_MAX_CALLS: '8'
          CONEXO_RSS_DRAFT: '0'
          CONEXO_RSS_DRAFT_STAGING: '0'
        run: python -m scripts.run_mda_live_ab_once

      - name: Retain public receipt and ciphertext only, never plaintext or provider credentials
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mda-ab-secure-${{ github.run_id }}
          path: work/mda-ab-live/public/
          if-no-files-found: error
          retention-days: 1
