name: Bot Telegram (polling 5/5min)

# Roda o admin/bot.py em rajadas curtas, sem servidor e sem cartao.
# Repo publico = minutos ilimitados. Concurrency unica impede 2 instancias (409).
# Segredos (repo Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_IDS, WP_URL, WP_USER, WP_APP_PASSWORD,
#   GROQ_API_KEY, GOOGLE_SHEETS_JSON
# O cron do GitHub pode atrasar alguns minutos; uso normal (/link, /drafts) ok.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-telegram
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "admin/bot-requirements.txt"

      - name: Instala deps do bot
        run: pip install -r admin/bot-requirements.txt

      - name: Roda o bot (~4,5 min, com overlap p/ zero intervalo)
        run: timeout 280 python admin/bot.py || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_IDS: ${{ secrets.TELEGRAM_ALLOWED_IDS }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
