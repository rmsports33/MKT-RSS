name: Bot Telegram (manual, sem looping)

# O bot só roda por solicitação manual do responsável; não há cron nem
# autodespacho recursivo, para reduzir consumo desnecessário.
# Orçamento Actions da conta US$ 0: não presumir runners ilimitados.
#
# Segredos (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_IDS, WP_URL, WP_USER, WP_APP_PASSWORD,
#   GROQ_API_KEY, GOOGLE_SHEETS_JSON
# Sem permissão de auto-dispatch.

on:
  workflow_dispatch:   # operação supervisionada, sem polling contínuo

permissions:
  contents: read
  actions: read              # sem permissão de auto-dispatch

concurrency:
  group: bot-telegram
  cancel-in-progress: true  # nunca dois pollers com o mesmo token (409)

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "admin/bot-requirements.txt"

      - name: Instala deps do bot
        run: pip install -r admin/bot-requirements.txt

      # REGRA DE SEGURANCA (bug de 26/09): o bot pode MORRER em segundos com
      # 409 Conflict (outro poller vivo). Se o passo de reacender rodasse
      # mesmo assim, cada morte gerava um disparo novo que cancelava o
      # poller saudavel -> tempestade de 100 rodadas. Entao:
      #   exit 124 = o `timeout` matou o bot depois de 280s = rodada BOA
      #   qualquer outro codigo = bot morreu (409, import, etc) = NAO reacende
      - name: Roda o bot (~4,5 min)
        run: |
          # `set +e` e `exit 0`: o GitHub roda o passo com `bash -e`, que aborta
          # no primeiro codigo != 0 — e o `timeout` devolve 124 de proposito
          # (bug de 26/09: passo nasava em failure e a cadeia nunca reacendia).
          set +e
          timeout 280 python admin/bot.py
          ec=$?
          echo "bot saiu com codigo $ec" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ec" = "124" ]; then
            echo "rodada concluída sem auto-dispatch" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rodada NAO concluida (codigo $ec)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
        # ATENCAO: sem este env o bot sai em segundos com
        # "TELEGRAM_BOT_TOKEN ausente" (foi o bug de 26/09 que gerou a tempestade).
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_IDS: ${{ secrets.TELEGRAM_ALLOWED_IDS }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
