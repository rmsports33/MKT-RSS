name: Bot Telegram (polling auto-acendido)

# O bot roda ~4,5 min e, ao terminar, DISPARA a proxima rodada (self-dispatch).
# Isso elimina o buraco entre rodadas e nao depende do cron, que em repo publico
# pode atrasar horas. O cron de 15 min fica so como rede de seguranca.
# Repo publico = minutos ilimitados, sem cartao.
#
# Segredos (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_IDS, WP_URL, WP_USER, WP_APP_PASSWORD,
#   GROQ_API_KEY, GOOGLE_SHEETS_JSON
# (GITHUB_TOKEN e automatico e so serve para o auto-dispatch.)

on:
  schedule:
    - cron: "*/15 * * * *"   # rede de seguranca (a cada 15 min)
  workflow_dispatch:         # permite disparo manual

permissions:
  contents: read
  actions: write             # permite o bot disparar a proxima rodada

concurrency:
  group: bot-telegram
  cancel-in-progress: true  # nunca dois pollers com o mesmo token (409)

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "admin/bot-requirements.txt"

      - name: Instala deps do bot
        run: pip install -r admin/bot-requirements.txt

      # REGRA CRITICA (bug de 26/09): o bot pode MORRER em segundos com
      # 409 Conflict (outro poller vivo). Se o passo de reacender rodasse
      # mesmo assim, cada morte gerava um disparo novo que cancelava o
      # poller saudavel -> tempestade de 100 rodadas. Entao:
      #   exit 124 = o `timeout` matou o bot depois de 280s = rodada BOA
      #   qualquer outro codigo = bot morreu (409, import, etc) = NAO reacende
      - name: Roda o bot (~4,5 min)
        run: |
          timeout 280 python admin/bot.py
          ec=$?
          echo "bot saiu com codigo $ec" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ec" = "124" ]; then
            echo "rodada-ok" > .rodada-ok
          else
            echo "rodada NAO concluida (codigo $ec) - nao reacende" >> "$GITHUB_STEP_SUMMARY"
          fi
        # ATENCAO: sem este env o bot sai em segundos com
        # "TELEGRAM_BOT_TOKEN ausente" (foi o bug de 26/09 que gerou a tempestade).
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_IDS: ${{ secrets.TELEGRAM_ALLOWED_IDS }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}

      - name: Reacende o bot para a proxima rodada
        if: success() && hashFiles('.rodada-ok') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run bot-poll.yml --ref master || echo "falhou o auto-dispatch (a rede de seguranca cobre)"
