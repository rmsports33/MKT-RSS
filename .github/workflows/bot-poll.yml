name: Bot Telegram (polling auto-acendido)

# O bot roda ~4,5 min e, ao terminar, DISPARA a proxima rodada (self-dispatch).
# Isso elimina o buraco entre rodadas e nao depende do cron, que em repo publico
# pode atrasar horas. O cron de 15 min fica so como rede de seguranca.
# Repo publico = minutos ilimitados, sem cartao.
#
# Segredos (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_IDS, WP_URL, WP_USER, WP_APP_PASSWORD,
#   GROQ_API_KEY, GOOGLE_SHEETS_JSON
# (GITHUB_TOKEN e automatico e so serve para o auto-dispatch.)

on:
  schedule:
    - cron: "*/15 * * * *"   # rede de seguranca (a cada 15 min)
  workflow_dispatch:         # permite disparo manual

permissions:
  contents: read
  actions: write             # permite o bot disparar a proxima rodada

concurrency:
  group: bot-telegram
  cancel-in-progress: true  # nunca dois pollers com o mesmo token (409)

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "admin/bot-requirements.txt"

      - name: Instala deps do bot
        run: pip install -r admin/bot-requirements.txt

      - name: Roda o bot (~4,5 min)
        run: timeout 280 python admin/bot.py || true

      - name: Reacende o bot para a proxima rodada
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run bot-poll.yml --ref master || echo "falhou o auto-dispatch (a rede de seguranca cobre)"
