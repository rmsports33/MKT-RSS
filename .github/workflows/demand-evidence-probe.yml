name: Private demand evidence - independent recovery
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: demand-evidence-probe
  cancel-in-progress: false
jobs:
  store:
    if: >-
      github.repository == 'rmsports33/MKT-RSS' && github.event.repository.private == false &&
      github.event.sender.login == github.repository_owner &&
      github.event.issue.title == '[demand-evidence] guardar serie e reproduzir'
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 3
    outputs:
      digest: ${{ steps.probe.outputs.digest }}
      pauta_id: ${{ steps.probe.outputs.pauta_id }}
      url_digest: ${{ steps.probe.outputs.url_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline evidence and storage regressions
        env:
          PYTHONPATH: tests
        run: python3 -S -m unittest test_demand_evidence -v
      - run: python3 -m pip install trendspyg==1.9.0 requests==2.34.2 feedparser==6.0.14
      - name: Save one real series privately with pending query review
        id: probe
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          CONEXO_DEMAND_TURSO_ALLOWED_HOST: mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python3 scripts/cloud_demand_evidence_probe.py write
  recover:
    needs: store
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install requests==2.34.2
      - name: Recover exact series and replay without source provider or local DB
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          CONEXO_DEMAND_TURSO_ALLOWED_HOST: mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          EVIDENCE_DIGEST: ${{ needs.store.outputs.digest }}
          EXPECTED_PAUTA_ID: ${{ needs.store.outputs.pauta_id }}
          EXPECTED_URL_DIGEST: ${{ needs.store.outputs.url_digest }}
        run: python3 scripts/cloud_demand_evidence_probe.py read

  binding:
    if: >-
      github.repository == 'rmsports33/MKT-RSS' && github.event.repository.private == false &&
      github.event.sender.login == github.repository_owner &&
      github.event.issue.title == '[demand-evidence] verificar vinculo existente'
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Readonly binding regressions
        env:
          PYTHONPATH: tests
        run: python3 -S -m unittest test_demand_queue_binding -v
      - run: python3 -m pip install requests==2.34.2
      - name: Existing private evidence and queue read only; no new Trends call
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          CONEXO_DEMAND_TURSO_ALLOWED_HOST: mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          EVIDENCE_DIGEST: f911230deb3bd7159bb1486f6b006a1e5192c02d5dd9a26a6ca53bbe4f809da8
        run: python3 scripts/cloud_demand_evidence_probe.py bind
