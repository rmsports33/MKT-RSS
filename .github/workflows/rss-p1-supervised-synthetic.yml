name: P1 editorial synthetic decision - supervised manual only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-synthetic-triage-homolog
  cancel-in-progress: false

jobs:
  synthetic-decision:
    if: ${{ github.repository == 'rmsports33/MKT-RSS' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && github.actor == 'rmsports33' }}
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31.0'
      - name: Synthetic-only decision with verified GitHub actor context
        env:
          GITHUB_ACTOR_VERIFIED: ${{ github.actor }}
          P1_AUTHORIZED_ACTORS: rmsports33
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          P1_CASE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, json
          from rss_editorial_triage import consultar_guard
          from mkt_flow_p0.triagem_auth import operador_autorizado
          from mkt_flow_p0.fila_pautas import registrar
          from mkt_flow_p0.triagem_decisoes import decidir
          consultar_guard()
          actor = operador_autorizado()
          if os.environ['GITHUB_ACTOR_VERIFIED'] != actor:
              raise SystemExit('BLOCKED: actor provenance mismatch')
          run_id = os.environ['P1_CASE']
          pauta = registrar({
              'fonte':'p1-synthetic-only',
              'titulo':'P1 prova sintetica auditada '+run_id,
              'link':'https://example.org/conexo-p1-supervisionada/'+run_id,
              'resumo':'Nao e noticia real'
          })
          if not pauta['novo']:
              raise SystemExit('BLOCKED: synthetic item already exists')
          event = decidir(pauta['id'], 'selecionar', 'Prova sintetica supervisionada', actor, confirmado=True)
          print(json.dumps({'synthetic':True,'decision':event['posterior'],
                            'audit_event':event['evento'],'operator':actor}))
          PY
