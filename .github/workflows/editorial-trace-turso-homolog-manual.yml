name: Editorial trace Turso homolog - manual only
on:
  push:
    branches: [master]
    paths: [.github/workflows/editorial-trace-turso-homolog-manual.yml]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type TURSO_HOMOLOG_TRACE; writes one metadata-only row into existing homolog database"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: editorial-trace-turso-homolog
  cancel-in-progress: false
jobs:
  trace_homolog:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.repository == 'rmsports33/MKT-RSS' && github.actor == 'rmsports33' && (github.event_name == 'push' || inputs.confirm == 'TURSO_HOMOLOG_TRACE') }}
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 5
    steps:
      - name: Checkout exact trace executor branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual RSS dependencies
        run: python -m pip install -r requirements/rss.txt
      - name: Run trace + canonical publisher regressions before any Turso write
        if: github.event_name == 'workflow_dispatch'
        env:
          GROQ_API_KEY: ''
          TURSO_AUTH_TOKEN: ''
          WP_APP_PASSWORD: ''
          CONEXO_RSS_DRAFT: '0'
          CONEXO_RSS_DRAFT_STAGING: '0'
        run: |
          python -m unittest discover -s tests -p 'test_editorial_trace_bridge.py' -v
          python -m unittest discover -s tests -p 'test_editorial_trace_turso.py' -v
          python -m unittest discover -s tests -p 'test_groq_trace_fingerprint.py' -v
          python -m unittest discover -s tests -p 'test_editorial_trace_release.py' -v
      - name: Authorized Turso homolog metadata write and readback
        env:
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          CONEXO_TRACE_TURSO_ALLOWED_HOST: mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GROQ_API_KEY: ''
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from mkt_flow_p0.editorial_trace import make_trace
          from mkt_flow_p0.editorial_trace_turso import save_turso_trace, get_turso_trace

          HOST = "mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io"
          assert os.environ["CONEXO_TRACE_TURSO_ALLOWED_HOST"] == HOST
          assert os.environ["TURSO_DATABASE_URL"] == "libsql://" + HOST
          if not os.getenv("TURSO_AUTH_TOKEN", "").strip():
              raise SystemExit("BLOCKED: no existing homolog Turso credential")
          # Record the revised draft version, never a release approval.
          import requests
          from tools.wp_identity_preflight import check_identity
          assert check_identity(os.environ) == "PASS", "publisher identity mismatch"
          reply = requests.get("https://conexotech.com.br/wp-json/wp/v2/posts/9810",
              params={"context":"edit", "_fields":"id,status,author,slug,content"},
              auth=(os.environ["WP_USER"],os.environ["WP_APP_PASSWORD"]),
              timeout=15,allow_redirects=False)
          assert reply.status_code == 200, "draft readback failed"
          post = reply.json()
          assert (post.get("id"),post.get("status"),post.get("author"),post.get("slug")) == (9810,"draft",3,"neo-home-robot-6001aae8ec40"), "draft identity changed"
          content = post["content"]["raw"]
          assert hashlib.sha256(content.encode()).hexdigest() == "10d1385096fa93ae811f61a96d6e2af3db8ddc08b636d4fff5b9063e296993a6", "draft version changed"
          packet = make_trace("https://www.1x.tech/discover/neo-home-robot",content,
                              post_id=9810,wp_readback=True)
          packet["events"].append({"stage":"editorial_revision", "module_id":"codex.assisted_editorial_adaptation", "module_version":"mkt-rss-trace/1", "status":"ASSISTED_ADAPTED", "evidence_ref":"wp-post-id:9810;content-sha256:10d1385096fa93ae811f61a96d6e2af3db8ddc08b636d4fff5b9063e296993a6"})
          assert packet["publication_authorized"] is False
          assert packet["events"][0]["status"] == "UNKNOWN"
          stored = save_turso_trace(packet)
          if stored.get("ok") is not True:
              raise SystemExit("BLOCKED: Turso write failed: " + stored.get("reason", "unknown"))
          read = get_turso_trace(packet["run_id"])
          if read.get("ok") is not True:
              raise SystemExit("BLOCKED: Turso readback failed: " + read.get("reason", "unknown"))
          assert read["trace"] == packet, "BLOCKED: readback differs from recorded run"
          assert read["trace"]["publication_authorized"] is False
          assert read["trace"]["events"][0]["status"] == "UNKNOWN"
          print("PASS: revised draft 9810 stored/read back exact trace metadata")
          print("run_id=" + packet["run_id"])
          print("storage=existing-homolog-turso")
          print("publication_authorized=false")
          PY
