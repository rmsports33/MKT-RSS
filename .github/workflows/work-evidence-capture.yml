name: Work evidence capture - Android source
on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/capture_android_drop_for_work.py'
      - '.github/workflows/work-evidence-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install limited extraction requirements
        run: python -m pip install trafilatura
      - name: Extract actual primary source and build verified package
        run: python -m scripts.capture_android_drop_for_work
      - name: Preserve provenance and package as CI artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-drop-evidence
          path: evidence-output/
          retention-days: 7
          if-no-files-found: error
