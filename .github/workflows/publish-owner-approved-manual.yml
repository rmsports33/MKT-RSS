name: Publish owner-approved article - MKT-RSS
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: WordPress draft ID approved in the owner panel
        required: true
        default: '9768'
        type: string
      version_sha256:
        description: Exact version displayed after owner approval
        required: true
        type: string
      confirm:
        description: Type PUBLICAR to publish this approved version once
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mkt-owner-publication
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'rmsports33/MKT-RSS' && github.actor == 'rmsports33' && github.ref == 'refs/heads/master' && inputs.confirm == 'PUBLICAR' }}
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2
      - name: Publish only the current owner-approved version and verify signed SEO
        env:
          POST_ID: ${{ inputs.post_id }}
          VERSION_SHA256: ${{ inputs.version_sha256 }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          CONEXO_TRACE_TURSO_ALLOWED_HOST: mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m tools.publish_owner_approved --post-id "$POST_ID" --version "$VERSION_SHA256" --execute
