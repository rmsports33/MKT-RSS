name: Publish owner-approved article - MKT-RSS
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: ID do rascunho aprovado no painel do proprietario
        required: true
        default: '9768'
        type: string
      version_sha256:
        description: 'Copie os 64 caracteres de "Versao para o MKT-RSS" apos aprovar; nao use o snapshot'
        required: true
        type: string
      confirm:
        description: Selecione PUBLICAR para publicar esta versao aprovada uma unica vez
        required: true
        type: choice
        default: NAO_PUBLICAR
        options:
          - NAO_PUBLICAR
          - PUBLICAR
permissions:
  contents: read
concurrency:
  group: mkt-owner-publication
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'rmsports33/MKT-RSS' && github.actor == 'rmsports33' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment: rss-homolog
    timeout-minutes: 4
    steps:
      - name: Validar confirmacao e campos antes de acessar credenciais
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          POST_ID: ${{ inputs.post_id }}
          VERSION_SHA256: ${{ inputs.version_sha256 }}
        run: |
          if [[ "$CONFIRM" != 'PUBLICAR' ]]; then
            echo '::error::Publicacao nao confirmada. Inicie um novo Run workflow e selecione PUBLICAR no campo confirm.'
            echo 'Publicacao nao iniciada: selecione PUBLICAR em uma nova execucao. Nenhum artigo foi alterado.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ! "$POST_ID" =~ ^[1-9][0-9]*$ || ! "$VERSION_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::Informe o ID do rascunho e os 64 caracteres de Versao para o MKT-RSS exibidos apos a aprovacao no WordPress.'
            echo 'Publicacao nao iniciada: confira post_id e version_sha256. Nenhum artigo foi alterado.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2
      - name: Publish only the current owner-approved version and verify signed SEO
        env:
          POST_ID: ${{ inputs.post_id }}
          VERSION_SHA256: ${{ inputs.version_sha256 }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TURSO_DATABASE_URL: libsql://mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          CONEXO_TRACE_TURSO_ALLOWED_HOST: mkt-rss-homolog-rmsports33.aws-ap-northeast-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m tools.publish_owner_approved --post-id "$POST_ID" --version "$VERSION_SHA256" --execute
