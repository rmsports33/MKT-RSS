name: CI (pytest)

# Valida cada push/PR. Usa requirements cheio (precisa de pytest + mocks).
on:
  push:
    branches: [main, master]
    paths:
      - '**/*.py'
      - '**/*.php'
      - '**/*.json'
      - '**/*.toml'
      - '**/*.ini'
      - 'requirements/**'
      - '**/requirements*.txt'
      - '.github/workflows/ci.yml'
      - 'AGENTS.md'
      - 'docs/EDITORIAL*'
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.php'
      - '**/*.json'
      - '**/*.toml'
      - '**/*.ini'
      - 'requirements/**'
      - '**/requirements*.txt'
      - '.github/workflows/ci.yml'
      - 'AGENTS.md'
      - 'docs/EDITORIAL*'
  workflow_dispatch:

permissions:
  contents: read

# PR mais recente cancela validação obsoleta; commits na master mantêm
# a verificação própria e não cancelam outra branch.
concurrency:
  group: ci-pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Identificar núcleo editorial fixado por hash
        id: editorial-core
        env:
          CORE_READ_TOKEN: ${{ secrets.CONEXO_CORE_READ_TOKEN }}
        run: |
          if [ -z "$CORE_READ_TOKEN" ]; then
            echo "::warning::Integração com núcleo privado não executada: configure CONEXO_CORE_READ_TOKEN com acesso somente leitura ao conexo-os."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          python3 - <<'PYCORE' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path("mkt_flow_p0/editorial_core.lock.json").read_text())
          print("repository=" + lock["origin_repository"])
          print("commit=" + lock["commit"])
          PYCORE

      - uses: actions/checkout@v4
        if: steps.editorial-core.outputs.enabled == 'true'
        with:
          token: ${{ secrets.CONEXO_CORE_READ_TOKEN }}
          persist-credentials: false
          repository: ${{ steps.editorial-core.outputs.repository }}
          ref: ${{ steps.editorial-core.outputs.commit }}
          path: .conexo-test-core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Instalar deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r redator-artigo-blogs/requirements.txt
          pip install 'python-telegram-bot>=21,<23'

      - name: Rodar suíte (núcleo + legado + redator)
        env:
          CONEXO_TEST_CORE_ROOT: ${{ steps.editorial-core.outputs.enabled == 'true' && format('{0}/.conexo-test-core', github.workspace) || '' }}
        run: |
          python -m pytest tests -q
          python -m pytest redator-artigo-blogs/tests -q

      - name: Diagnóstico real do catálogo RSS sem escrita (homologação pontual)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/catalogo-homologacao-live-20261113' }}
        env:
          CONEXO_REQUIRE_CLOUD_PERSISTENCE: '1'
          TURSO_DATABASE_URL: ''
          TURSO_AUTH_TOKEN: ''
        run: |
          python -m pip install 'feedparser>=6.0.0'
          python rss_queue_collect.py --fonte gsmarena --limit 10 --dry-run > /tmp/catalog-diagnostic.json
          python - <<'PY'
          import json, os
          with open('/tmp/catalog-diagnostic.json', encoding='utf-8') as source:
              d = json.load(source)
          assert d.get('modo') == 'DIAGNOSTICO_SEM_ESCRITA', d
          assert d['novas'] == 0 and d['duplicadas'] == 0, d
          assert d.get('analisadas', 0) > 0, d
          assert not d['falhas'], d
          c = d['catalogo']
          assert c['correspondencias'] + c['sem_correspondencia'] + c['revisao'] == d['analisadas'], d
          print('PASS: diagnóstico feed real, nenhum registro, contadores coerentes')
          print(json.dumps(d, ensure_ascii=False, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Catálogo — coleta real sem escrita\\n')
              summary.write(f"- Itens analisados: {d['analisadas']}\\n")
              summary.write(f"- Correspondências: {c['correspondencias']}\\n")
              summary.write(f"- Sem correspondência: {c['sem_correspondencia']}\\n")
              summary.write(f"- Revisão: {c['revisao']}\\n")
              summary.write('- Escritas na fila: 0 (dry-run)\\n')
          PY
