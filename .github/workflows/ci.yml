name: CI (pytest)

# Valida cada push/PR. Usa requirements cheio (precisa de pytest + mocks).
on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.php'
      - '**/*.json'
      - '**/*.toml'
      - '**/*.ini'
      - 'requirements/**'
      - '**/requirements*.txt'
      - '.github/workflows/ci.yml'
      - 'AGENTS.md'
      - 'docs/EDITORIAL*'
  workflow_dispatch:

permissions:
  contents: read

# PR mais recente cancela validação obsoleta; commits na master mantêm
# a verificação própria e não cancelam outra branch.
concurrency:
  group: ci-pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Instalar deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r redator-artigo-blogs/requirements.txt
          pip install 'python-telegram-bot>=21,<23'

      - name: Rodar suíte (núcleo + legado + redator)
        run: |
          python -m pytest tests -q
          python -m pytest redator-artigo-blogs/tests -q
