name: Product catalog - one real RSS to Turso proof
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: catalog-one-real-link
  cancel-in-progress: false
jobs:
  proof:
    if: >-
      github.repository == 'rmsports33/MKT-RSS' &&
      github.event.sender.login == github.repository_owner &&
      github.event.issue.title == '[catalogo] comprovar primeiro vinculo RSS real'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar somente cliente RSS existente
        run: python -m pip install 'requests>=2.31.0' 'feedparser>=6.0.0'
      - name: Comprovar um único vínculo no Turso e fazer readback
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CONEXO_PRODUCT_LINKS_ENABLED: '1'
          WP_APP_PASSWORD: ''
          GROQ_API_KEY: ''
        run: |
          python -m scripts.catalog_first_real_link_proof > /tmp/product-link-proof.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/product-link-proof.json').read_text())
          assert data['result'] == 'PASS'
          assert data['authenticated_turso_readback'] is True
          assert data['link_count'] == 1
          assert data['wordpress_modified'] is False
          assert data['publication_authorized'] is False
          print(json.dumps(data, ensure_ascii=False, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
              report.write('### Primeiro vínculo RSS operacional confirmado\n')
              for field in ('source', 'product_id', 'pauta_id', 'source_url',
                            'queue_new', 'queue_state', 'link_count',
                            'authenticated_turso_readback', 'wordpress_modified'):
                  report.write(f'- {field}: {data[field]}\n')
          PY
